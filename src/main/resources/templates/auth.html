<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - PTIT Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            --primary-color: #ed1c24;
            --content-width: 1422px;
            --gutter: 30px;
            --collumn: 91px;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
            font-family: "Arial", sans-serif;
        }

        body {
            height: 100vh;
            background-color: white;
        }

        a {
            color: var(--primary-color);
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .section1 {
            width: 35%;
            height: 100vh;
        }

        .section2 {
            width: 65%;
            position: relative;
            overflow: hidden;
        }

        .section2 .illus {
            position: absolute;
            height: 450px;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
            z-index: 2;
        }

        .section2 .round {
            position: absolute;
            height: 1050px;
            right: -130px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .forms {
            height: 100%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 112px;
        }

        .form {
            margin: auto 0;
            width: 100%;
        }

        .form form {
            width: 100%;
        }

        .title {
            font-size: 2.4rem;
            opacity: 0.87;
        }

        .desc {
            margin-top: 8px;
            font-size: 1.8rem;
            opacity: 0.4;
        }

        .type {
            display: block;
            margin-bottom: 24px;
            width: 100%;
            height: 64px;
            font-size: 16px;
            color: #696969;
            border: #d9d9d9 2px solid;
            border-radius: 2px;
            padding: 0 12px;
            transition: all 0.3s;
        }

        .idStudent {
            margin-top: 42px;
        }

        .login .logo {
            height: 100px;
        }

        .login .checkbox-text {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
        }

        .login .checkbox-text .text {
            font-size: 14px;
        }

        .login-btn input,
        .signup-btn input {
            margin-top: 42px;
            border: none;
            width: 100%;
            height: 56px;
            color: white;
            font-size: 2.4rem;
            background-color: var(--primary-color);
            cursor: pointer;
        }

        .signup-btn input {
            margin-top: 24px;
        }

        .signed-up-now,
        .login-now {
            margin-top: 48px;
            display: block;
            width: 100%;
            text-align: center;
            font-size: 1.8rem;
        }

        .signup {
            display: none;
        }

        .password-strength {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 24px;
        }

        .password-strength .bar {
            flex-grow: 1;
            height: 4px;
            width: 50px;
            background-color: #ccc;
            transition: background-color 0.3s;
        }

        .error-message {
            color: var(--primary-color);
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 16px;
        }

        /* Success message for post-registration */
        .success-message {
            color: #2e7d32; /* green */
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 16px;
            display: none;
        }

        @media screen and (max-width: 1400px) {
            .container {
                display: flex;
                align-items: center;
                justify-self: center;
            }

            .section1 {
                display: flex;
                justify-content: center;
                width: 100%;
                margin-right: 0;
            }

            .forms {
                width: 100%;
                max-width: 370px;
                margin-left: 12px;
                margin-right: 12px;
                padding: 0;
            }
            .section2 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section1">
            <div class="forms">
                <!-- Login Form -->
                <div class="form login">
                    <img class="logo" th:src="@{/images/logo.png}" alt="PTIT Logo" />
                    <div class="login-title" style="margin-top: 60px">
                        <span class="title">Đăng nhập</span>
                        <p class="desc">Chào mừng bạn đến với thư viện PTIT</p>
                    </div>

                    <div class="success-message" id="signup_success_msg"></div>

                    <div class="error-message"
                         th:if="${error} != null or ${param.error} != null"
                         th:text="${error} != null ? ${error} : 'Tên đăng nhập hoặc mật khẩu không đúng'">
                    </div>

                    <form th:action="@{/user/login}" method="POST">
                        <input
                            type="text"
                            name="username"
                            placeholder="Mã sinh viên"
                            class="idStudent type"
                            required
                        />
                        <input
                            type="password"
                            name="password"
                            class="password type"
                            placeholder="Mật khẩu"
                            required
                        />

                        <div class="checkbox-text">
                            <div class="checkbox-content">
                                <input type="checkbox" id="logCheck" name="remember" />
                                <label for="logCheck" class="text">Ghi nhớ mật khẩu</label>
                            </div>

                            <a href="#" class="text">Quên mật khẩu</a>
                        </div>

                        <div class="login-btn">
                            <input type="submit" value="Đăng nhập" />
                        </div>
                    </form>

                    <div class="signed-up-now">
                        <span>
                            Chưa có tài khoản?
                            <a href="#" class="signup-link">Đăng ký ngay</a>
                        </span>
                    </div>
                </div>

                <!-- Register Form -->
                <div class="form signup">
                    <div class="login-title">
                        <span class="title">Đăng ký</span>
                        <p class="desc">Khám phá thư viện PTIT ngay hôm nay</p>
                    </div>

                    <form method="POST" style="position: relative">
                        <span
                            style="
                                position: absolute;
                                top: -24px;
                                left: 0;
                                font-size: 14px;
                                color: var(--primary-color);
                            "
                            class="error_msg"
                        ></span>

                        <input
                            type="text"
                            name="username"
                            placeholder="Mã sinh viên"
                            class="idStudent type"
                            id="user_username"
                            required
                        />

                        <input
                            type="text"
                            name="email"
                            placeholder="Email học viện (@stu.ptit.edu.vn)"
                            class="emailStudent type"
                            id="user_email"
                            required
                        />
                        <input
                            type="password"
                            name="password"
                            class="password type"
                            placeholder="Mật khẩu"
                            id="user_password"
                            required
                        />

                        <div class="password-strength">
                            <div class="bar bar-1"></div>
                            <div class="bar bar-2"></div>
                            <div class="bar bar-3"></div>
                        </div>

                        <input
                            type="password"
                            name="retypePassword"
                            class="retypePassword type"
                            placeholder="Xác nhận mật khẩu"
                            id="user_retype_password"
                            required
                        />

                        <div class="signup-btn">
                            <input type="submit" value="Đăng ký" />
                        </div>
                    </form>

                    <div class="login-now">
                        <span>
                            Bạn đã có tài khoản?
                            <a href="#" class="login-link">Đăng nhập</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class="section2">
            <img class="round" th:src="@{/images/round.png}" alt="" />
        </div>
    </div>

    <script th:src="@{/js/jquery3.6.0.js}"></script>
    <script>
        const login = document.querySelector(".login-link");
        const signup = document.querySelector(".signup-link");
        const loginForm = document.querySelector(".login");
        const signupForm = document.querySelector(".signup");

        login.addEventListener("click", (e) => {
            e.preventDefault();
            loginForm.style.display = "block";
            signupForm.style.display = "none";
        });

        signup.addEventListener("click", (e) => {
            e.preventDefault();
            loginForm.style.display = "none";
            signupForm.style.display = "block";
            const successMsg = document.getElementById("signup_success_msg");
            if (successMsg) successMsg.style.display = "none";
        });

        // Registration validation logic
        let typingTimer;
        const doneTypingInterval = 2000;
        const inputFields = document.querySelectorAll(
            "#user_username, #user_email, #user_password, #user_retype_password"
        );

        var signupMessageResponse;
        function sendData() {
            const username = document.getElementById("user_username").value;
            const email = document.getElementById("user_email").value;
            const password = document.getElementById("user_password").value;
            const retypePassword = document.getElementById("user_retype_password").value;

            $.ajax({
                url: "/user/register",
                type: "POST",
                data: {
                    username: username,
                    email: email,
                    password: password,
                    retypePassword: retypePassword
                },
                dataType: "json",
                success: function (data) {
                    signupMessageResponse = data;
                    
                    if (data.globalMessage) {
                        document.querySelector(".error_msg").innerHTML = data.globalMessage;
                    }

                    // Password strength indicator
                    const strengthDiv = document.querySelector(".password-strength");
                    if (password.length >= 6) {
                        strengthDiv.style.display = "flex";
                        const bars = [".bar-1", ".bar-2", ".bar-3"];
                        
                        // Reset bars
                        bars.forEach(bar => {
                            document.querySelector(bar).style.backgroundColor = "#ccc";
                        });

                        // Set strength colors based on password strength
                        if (password.length >= 10 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                            // Strong
                            bars.forEach(bar => {
                                document.querySelector(bar).style.backgroundColor = "#92d050";
                            });
                        } else if (password.length >= 8) {
                            // Medium
                            document.querySelector(".bar-1").style.backgroundColor = "#f2aa84";
                            document.querySelector(".bar-2").style.backgroundColor = "#f2aa84";
                        } else {
                            // Weak
                            document.querySelector(".bar-1").style.backgroundColor = "#ed1c24";
                        }
                    }
                },
                error: function () {
                    console.log("Có lỗi xảy ra");
                }
            });
        }

        inputFields.forEach((input) => {
            input.addEventListener("input", () => {
                if (signupForm.style.display !== "none") {
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(sendData, doneTypingInterval);
                }
            });
        });

        const signupFormElement = document.querySelector(".signup form");
        if (signupFormElement) {
            $(signupFormElement).on('submit', function (e) {
                e.preventDefault();
                const $form = $(this);

                $.post('/user/register', $form.serialize() + '&done=register')
                    .done(function (data) {
                        signupMessageResponse = data;

                        if (data && data.valid) {
                            $('.error_msg').text('');
                            $(loginForm).show();
                            $(signupForm).hide();
                            $('#signup_success_msg').text(data.globalMessage || 'Đăng ký thành công').show();
                            $('.login input[name="username"]').val($form.find('#user_username').val()).focus();
                            $form[0].reset();
                            $('.password-strength').hide();
                        } else {
                            $('.error_msg').text((data && data.globalMessage) ? data.globalMessage : 'Vui lòng kiểm tra thông tin của bạn.');
                        }
                    })
                    .fail(function () {
                        $('.error_msg').text('Có lỗi xảy ra. Vui lòng thử lại.');
                    });
            });
        }
    </script>
</body>
</html>
