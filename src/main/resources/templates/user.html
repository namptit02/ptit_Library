<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="PTIT Library" />
        <meta
            property="og:description"
            content="Ptiters are united by a share purpose"
        />
        <meta property="og:image" th:content="@{/images/icon.svg}" />
        <meta property="og:type" content="website" />
        <link rel="icon" th:href="@{/images/icon.svg}" />

        <title>PTIT Library - Profile</title>

        <link rel="stylesheet" th:href="@{/css/reset.css}" />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />

        <style>
            body {
                box-sizing: border-box;
            }
            .section1,
            .section2 {
                min-height: calc(100vh - 148px);
            }

            .profile {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 32px;
                padding-right: 24px;
            }

            .avatar {
                width: 128px;
                height: 128px;
                background-size: cover;
                background-position: center;
                border-radius: 50%;
                background-repeat: no-repeat;
                opacity: 1;
            }

            .avatar.loading {
                animation: loading 1.5s ease-in-out infinite;
            }

            @keyframes loading {
                0% {
                    opacity: 0.5;
                    transform: scale(1);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.05);
                }
                100% {
                    opacity: 0.5;
                    transform: scale(1);
                }
            }

            .profile .student_name {
                margin-top: 24px;
                font-size: 1.8rem;
                font-weight: 700;
            }

            .profile .student_id {
                margin-top: 8px;
                font-size: 1.6rem;
            }

            .profile__email {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .profile__email .title {
                margin-top: 24px;
                font-size: 1.6rem;
                font-weight: 700;
            }

            .profile .student_email {
                margin-top: 8px;
                display: block;
                width: 150px;
                font-size: 1.6rem;
                text-align: center;
                word-wrap: break-word;
                color: #467886;
                text-decoration: underline;
            }

            .profile__gpa,
            .profile__rank {
                display: flex;
                align-self: center;
                justify-content: center;
                gap: 3px;
            }

            .profile__gpa {
                margin-top: 24px;
            }

            .profile__rank {
                margin-top: 8px;
            }

            .profile__gpa .title,
            .profile__rank .title {
                font-size: 1.6rem;
                font-weight: 700;
            }

            .profile .student_gpa {
                font-size: 1.6rem;
            }

            .profile .student_rank {
                font-size: 1.6rem;
            }

            .social {
                margin-top: 20px;
                width: 100%;
                height: 40px;
                text-align: center;
                font-size: 1.8rem;
                line-height: 40px;
                color: white;
                background-color: var(--primary-color);
            }

            /* #Section2 */

            .navigator {
                margin-top: 24px;
            }

            .navigator ul {
                display: flex;
                justify-content: flex-end;
                padding-right: 3.2em;
            }

            .navigator li span {
                margin-left: 12px;
                display: inline-block;
                height: 32px;
                padding: 0 32px;
                color: white;
                font-size: 1.6rem;
                line-height: 32px;
                background-color: var(--primary-color);
                border-radius: 6px;
                cursor: pointer;
                box-sizing: border-box;
            }

            .navigator li span.unselect {
                background-color: white;
                outline: 2px #d9d9d9 solid;
                color: black;
            }

            .navigator_content {
                margin: 0 3.2em;
                margin-left: 64px;
            }
            .hello {
                position: relative;
                margin-top: 24px;
            }

            .hello span {
                display: inline-block;
                position: absolute;
                top: -14px;
                left: 6rem;
                padding: 0 8px;
                height: 28px;
                font-size: 1.8rem;
                line-height: 28px;
                background-color: white;
            }

            .box {
                height: 200px;
                border: 2px #d9d9d9 solid;
            }

            .small_lib {
                margin-top: 80px;
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .small_lib a {
                font-size: 1.8rem;
                color: var(--primary-color);
                text-decoration: underline;
            }

            .small_lib a i {
                font-weight: 700;
            }

            /* Table CSS */

            table {
                margin-top: 24px;
                width: 100%;
                overflow-x: auto;
            }

            table tr {
                height: 44px;
                width: 100%;
            }

            table td {
                vertical-align: middle;
                line-height: 44px;
                text-align: center;
            }

            table tr:nth-child(odd) {
                background-color: #fcfcfc;
            }

            table tr:nth-child(even) {
                background-color: #f4f4f4;
            }

            table tr:first-child td {
                font-size: 1.6rem;
                font-weight: 700;
            }

            table tr:not(:first-child) td {
                font-size: 1.6rem;
            }

            table img {
                cursor: pointer;
            }

            table tr td:not(:first-child) {
                margin: 0 8px;
            }

            /* ProfileEdit */
            .edit_profile {
                margin-top: 24px;
            }

            .edit_avatar {
                margin: 0 128px;
                display: flex;
                align-items: center;
                gap: 16px;
            }

            .change_avatar{
                font-size: 1.6rem;
                line-height: 32px;
                height: 32px;
                padding: 0 12px;
                border-radius: 16px;
                cursor: pointer;
                outline: 2px #d9d9d9 solid;
            }

            .change_avatar:hover {
                background-color: #f2f2f2;
            }
        </style>
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}"></div>
        
        <div class="header">
            <div class="main-content">
                <div class="body">
                    <div class="section1">
                        <h3 style="margin-top: 24px">Profile / Tài khoản</h3>
                        <div class="profile">
                            <div class="avatar" th:style="'background-image: url(' + ${session.avatar} + ');'"></div>
                            <span class="student_name" th:text="${session.full_name}">Nguyễn Việt Huy</span>
                            <span class="student_id" th:text="${session.username}">B22DCCN393</span>

                            <div class="profile__email">
                                <span class="title">Email: </span>
                                <span class="student_email" th:text="${session.email}">example@stu.ptit.edu.vn</span>
                            </div>

                            <div class="profile__rank">
                                <span class="title">Xếp hạng: </span>
                                <span class="student_rank">#313</span>
                            </div>
                            <div class="profile__gpa">
                                <span class="title">Gpa: </span>
                                <span class="student_gpa">3.33</span>
                            </div>
                        </div>
                    </div>
                    <div class="section2">
                        <div class="navigator">
                            <ul>
                                <li><span class="about">About</span></li>
                                <li>
                                    <span class="borrow unselect"
                                        >Tài liệu đã mượn</span
                                    >
                                </li>
                                <li>
                                    <span class="edit unselect"
                                        >Edit Profile</span
                                    >
                                </li>
                            </ul>
                        </div>

                        <div class="navigator_content">
                            <div class="edit_profile">
                                <form
                                    th:action="@{/user/avatar}"
                                    method="post"
                                    enctype="multipart/form-data"
                                >
                                    <div class="edit_avatar">
                                        <input
                                            type="hidden"
                                            name="action"
                                            value="change_avatar"
                                        />
                                        <div
                                            class="avatar"
                                            style="width: 68px; height: 68px"
                                            th:style="'background-image: url(' + ${session.avatar} + ');'"
                                        ></div>
                                        <input
                                            style="display: none"
                                            type="file"
                                            name="avatar"
                                            id="avatar_input"
                                            accept="image/*"
                                            onchange="uploadAvatarAjax()"
                                        />
                                        <label
                                            for="avatar_input"
                                            class="change_avatar"
                                            >Upload new avatar</label
                                        >
                                    </div>
                                </form>

                                <div style="margin-top: 40px; margin-left: 24px;">
                                    <h4 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 20px;">Cập nhật thông tin cá nhân</h4>
                                    
                                    <form id="updatePersonalInfoForm">
                                        <div style="margin-bottom: 16px;">
                                            <label for="personalFullName" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Họ và tên:</label>
                                            <input 
                                                type="text" 
                                                id="personalFullName" 
                                                name="personalFullName" 
                                                placeholder="Nhập họ và tên"
                                                th:value="${user != null ? user.fullName : session.full_name}"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                            />
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="dateOfBirth" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Ngày sinh:</label>
                                            <input 
                                                type="date" 
                                                id="dateOfBirth" 
                                                name="dateOfBirth" 
                                                th:value="${user != null && user.dateOfBirth != null ? user.dateOfBirth : ''}"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                            />
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="gender" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Giới tính:</label>
                                            <select 
                                                id="gender" 
                                                name="gender"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                            >
                                                <option value="">-- Chọn giới tính --</option>
                                                <option value="Nam" th:selected="${user != null && user.gender == 'Nam'}">Nam</option>
                                                <option value="Nữ" th:selected="${user != null && user.gender == 'Nữ'}">Nữ</option>
                                                <option value="Khác" th:selected="${user != null && user.gender == 'Khác'}">Khác</option>
                                            </select>
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="phone" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Số điện thoại:</label>
                                            <input 
                                                type="tel" 
                                                id="phone" 
                                                name="phone" 
                                                placeholder="Nhập số điện thoại"
                                                th:value="${user != null ? user.phone : ''}"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                            />
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="address" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Địa chỉ:</label>
                                            <input 
                                                type="text" 
                                                id="address" 
                                                name="address" 
                                                placeholder="Nhập địa chỉ"
                                                th:value="${user != null ? user.address : ''}"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                            />
                                        </div>

                                        <button 
                                            type="button" 
                                            onclick="updatePersonalInfo()"
                                            style="padding: 8px 24px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; font-size: 1.6rem; cursor: pointer; margin-top: 12px;"
                                        >Lưu thay đổi</button>
                                        
                                        <div id="personalInfoMessage" style="margin-top: 12px; font-size: 1.6rem;"></div>
                                    </form>
                                </div>

                                <div style="margin-top: 40px; margin-left: 24px;">
                                    <h4 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 20px;">Đổi mật khẩu</h4>
                                    
                                    <form id="changePasswordForm">
                                        <div style="margin-bottom: 16px;">
                                            <label for="oldPassword" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Mật khẩu cũ:</label>
                                            <input 
                                                type="password" 
                                                id="oldPassword" 
                                                name="oldPassword" 
                                                placeholder="Nhập mật khẩu cũ"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                                required
                                            />
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="newPassword" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Mật khẩu mới:</label>
                                            <input 
                                                type="password" 
                                                id="newPassword" 
                                                name="newPassword" 
                                                placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                                required
                                            />
                                        </div>

                                        <div style="margin-bottom: 16px;">
                                            <label for="retypePassword" style="display: block; font-size: 1.6rem; margin-bottom: 8px; font-weight: 500;">Nhập lại mật khẩu mới:</label>
                                            <input 
                                                type="password" 
                                                id="retypePassword" 
                                                name="retypePassword" 
                                                placeholder="Nhập lại mật khẩu mới"
                                                style="width: 100%; max-width: 400px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 1.6rem;"
                                                required
                                            />
                                        </div>

                                        <button 
                                            type="button" 
                                            onclick="changePassword()"
                                            style="padding: 8px 24px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; font-size: 1.6rem; cursor: pointer; margin-top: 12px;"
                                        >Đổi mật khẩu</button>
                                        
                                        <div id="passwordMessage" style="margin-top: 12px; font-size: 1.6rem;"></div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

        <script th:src="@{/js/jquery3.6.0.js}"></script>
        <script th:inline="javascript">
            /*<![CDATA[*/
            var username_account = /*[[${session.username}]]*/ '';

            var editProfileContent = null;

            function focus(tab1, tab2, tab3) {
                tab1.classList.remove("unselect");
                tab2.classList.add("unselect");
                tab3.classList.add("unselect");
            }

            function uploadAvatarAjax() {
                var fileInput = document.getElementById("avatar_input");
                var file = fileInput.files[0];
                
                if (!file) return;
                
                var formData = new FormData();
                formData.append("avatar", file);
                
                var avatarElements = document.querySelectorAll(".avatar");
                avatarElements.forEach(function(elem) {
                    elem.classList.add("loading");
                });
                
                $.ajax({
                    url: "/user/avatar",
                    type: "POST",
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        var reader = new FileReader();
                        reader.onload = function(e) {
                            var newAvatarUrl = e.target.result;
                            
                            var avatarElements = document.querySelectorAll(".avatar");
                            avatarElements.forEach(function(elem) {
                                elem.style.backgroundImage = "url('" + newAvatarUrl + "')";
                                elem.classList.remove("loading");
                            });
                            
                            setTimeout(function() {
                                location.reload();
                            }, 500);
                        };
                        reader.readAsDataURL(file);
                    },
                    error: function() {
                        alert("Lỗi khi upload avatar");
                        var avatarElements = document.querySelectorAll(".avatar");
                        avatarElements.forEach(function(elem) {
                            elem.classList.remove("loading");
                        });
                    }
                });
                
                fileInput.value = "";
            }

            var aboutTab = document.querySelector(".about");
            var borrowTab = document.querySelector(".borrow");
            var editTab = document.querySelector(".edit");

            var naviContent = $(".navigator_content");
            
            // Store the edit profile content on page load
            document.addEventListener("DOMContentLoaded", function() {
                editProfileContent = naviContent.html();
            });

            aboutTab.addEventListener("click", function (e) {
                e.preventDefault();
                focus(aboutTab, borrowTab, editTab);

                naviContent.html(
                    `
                <div class="about_content">
                    <div class="hello">
                        <span>Giới thiệu</span>
                        <div class="box"></div>
                    </div>

                    <div class="small_lib">
                        <img src="/images/drive.svg" alt="" />
                        <a href="">
                            Thư viện của <i>Huy</i>
                        </a>
                    </div>
                </div>
            `
                );
            });

            borrowTab.addEventListener("click", function (e) {
                e.preventDefault();
                focus(borrowTab, aboutTab, editTab);

                $.ajax({
                    url: "/borrow/records",
                    type: "GET",
                    dataType: "json",
                    data: { username: username_account },

                    success: function (data) {
                        console.log(data);
                        naviContent.html("");
                        var content = "";
                        content += `
                        <table>
                                    <tr>
                                    <td></td>
                                    <td>Tên tài liệu</td>
                                    <td>Tác giả</td>
                                    <td>Năm xuất bản</td>
                                    <td>Ngày đăng ký</td>
                                    <td>Trạng thái</td>
                                </tr>`;

                        data.forEach((record) => {
                            if (
                                record.status !== "Đã trả" &&
                                record.status !== "Đăng ký bị hủy"
                            ) {
                                content +=
                                    `
                                 <tr>
                                    <td>
                                        <img
                                            style="
                                                margin: 0 12px;
                                                width: 24px;
                                                vertical-align: middle;
                                            "
                                            src="/images/red.svg"
                                            alt=""
                                        />
                                    </td>
                                    <td> ` +
                                    record.title +
                                    `
                                    </td>
                                    <td> ` +
                                    record.author +
                                    ` </td> 
                                    <td> ` +
                                    record.published_year +
                                    ` </td>
                                    <td>  ` +
                                    record.borrow_date +
                                    ` </td>
                                    <td style="font-weight: 700">` +
                                    record.status +
                                    `</td>
                                </tr>
                                `;
                            }
                        });

                        content += `</table>`;
                        naviContent.append(content);
                    },
                });
            });

            editTab.addEventListener("click", function (e) {
                e.preventDefault();

                focus(editTab, borrowTab, aboutTab);
                
                if (editProfileContent) {
                    naviContent.html(editProfileContent);
                    document.getElementById("avatar_input").addEventListener("change", function (e) {
                        var avatarDiv = document.querySelector(".avatar");
                        avatarDiv.classList.add("loading");
                    });
                }
            });

            function updatePersonalInfo() {
                var fullName = document.getElementById("personalFullName").value;
                var dateOfBirth = document.getElementById("dateOfBirth").value;
                var gender = document.getElementById("gender").value;
                var phone = document.getElementById("phone").value;
                var address = document.getElementById("address").value;
                var messageDiv = document.getElementById("personalInfoMessage");

                $.ajax({
                    url: "/user/update-personal-info",
                    type: "POST",
                    data: {
                        fullName: fullName,
                        dateOfBirth: dateOfBirth,
                        gender: gender,
                        phone: phone,
                        address: address
                    },
                    success: function (data) {
                        if (data.valid) {
                            messageDiv.innerHTML = '<span style="color: green; font-weight: 700;">' + data.globalMessage + '</span>';
                            setTimeout(function() {
                                window.location.href = "/user/profile";
                            }, 1000);
                        } else {
                            messageDiv.innerHTML = '<span style="color: red;">' + data.globalMessage + '</span>';
                        }
                    },
                    error: function () {
                        messageDiv.innerHTML = '<span style="color: red;">Có lỗi xảy ra. Vui lòng thử lại.</span>';
                    }
                });
            }

            // Change Password Function
            function changePassword() {
                var oldPassword = document.getElementById("oldPassword").value;
                var newPassword = document.getElementById("newPassword").value;
                var retypePassword = document.getElementById("retypePassword").value;
                var passwordMessage = document.getElementById("passwordMessage");

                if (!oldPassword) {
                    passwordMessage.innerHTML = '<span style="color: red;">Mật khẩu cũ không được để trống</span>';
                    return;
                }

                if (!newPassword) {
                    passwordMessage.innerHTML = '<span style="color: red;">Mật khẩu mới không được để trống</span>';
                    return;
                }

                if (newPassword.length < 6) {
                    passwordMessage.innerHTML = '<span style="color: red;">Mật khẩu mới phải có ít nhất 6 ký tự</span>';
                    return;
                }

                if (newPassword !== retypePassword) {
                    passwordMessage.innerHTML = '<span style="color: red;">Mật khẩu nhập lại không khớp</span>';
                    return;
                }

                $.ajax({
                    url: "/user/change-password",
                    type: "POST",
                    data: {
                        oldPassword: oldPassword,
                        newPassword: newPassword,
                        retypePassword: retypePassword
                    },
                    success: function (data) {
                        if (data.valid) {
                            passwordMessage.innerHTML = '<span style="color: green; font-weight: 700;">' + data.globalMessage + '</span>';
                            document.getElementById("changePasswordForm").reset();
                            setTimeout(function() {
                                window.location.href = "/user/profile";
                            }, 1000);
                        } else {
                            passwordMessage.innerHTML = '<span style="color: red;">' + data.globalMessage + '</span>';
                        }
                    },
                    error: function () {
                        passwordMessage.innerHTML = '<span style="color: red;">Có lỗi xảy ra. Vui lòng thử lại.</span>';
                    }
                });
            }
            console.log(resetAvatarbtn);
        </script>
    </body>
</html>
