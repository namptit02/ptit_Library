<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="PTIT Library" />
        <meta
            property="og:description"
            content="Ptiters are united by a share purpose"
        />
        <meta property="og:image" th:content="@{/images/icon.svg}" />
        <meta property="og:type" content="website" />
        <link rel="icon" th:href="@{/images/icon.svg}" />

        <title>PTIT Library - Management</title>

        <link rel="stylesheet" th:href="@{/css/reset.css}" />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />

        <style>
            .header .main-content {
                min-height: calc(100vh - 148px);
            }

            .header .body {
                margin-top: 56px;
            }
            .search-student-box {
                position: relative;
                margin-left: 0;
                margin-top: 24px;
                padding-left: 12px;
                border-radius: 8px;
                width: 60%;
                outline: 2px #bfbfbf solid;
            }

            .search-student-box .material-symbols-outlined {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                right: 0.4em;
            }

            .input_text {
                width: 100%;
                height: 48px;
                border-radius: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 16px;
                outline: none;
                border: none;
            }

            .search-student-box span {
                cursor: pointer;
            }

            .box {
                width: 100%;
                display: flex;
            }

            .box-1 {
                display: flex;
                flex-direction: column;
                flex: 1;
                width: 100%;
            }

            .box-2 {
                flex: 1;
                width: 100%;
            }

            .box-1 .title {
                font-size: 2rem;
            }

            .box-1 .row {
                margin-top: 48px;
            }

            .box-1 .row span {
                font-size: 1.6rem;
            }

            .box-1 .row {
                display: flex;
                gap: 24px;
            }

            .box-1 .small-navi {
                position: relative;
                opacity: 0.6;
                cursor: pointer;
                text-align: center;
            }

            .box-1 .small-navi.focus {
                font-weight: 700;
                opacity: 1;
            }

            .box-1 .small-navi::after {
                content: "";
                position: absolute;
                top: 24px;
                left: 50%;
                transform: translateX(-50%);
                width: 48px;
                height: 3px;
                background-color: black;
            }

            .box-1 .small-navi.waiting::after {
                background-color: var(--primary-color);
            }

            .box-1 .small-navi.borrowed::after {
                background-color: #92d050;
            }

            .box-1 .small-navi.expired::after {
                background-color: #f2aa84;
            }

            /* Table CSS */
            table {
                margin-top: 48px;
                width: 100%;
                overflow-x: auto;
            }

            table tr {
                height: 44px;
                width: 100%;
            }

            table td {
                vertical-align: middle;
                line-height: 44px;
                text-align: center;
            }

            table tr:nth-child(odd) {
                background-color: #fcfcfc;
            }

            table tr:nth-child(even) {
                background-color: #f4f4f4;
            }

            table tr:first-child td {
                font-size: 1.6rem;
                font-weight: 700;
            }

            table tr:not(:first-child) td {
                font-size: 1.6rem;
            }

            table img {
                cursor: pointer;
            }

            table tr td:not(:first-child) {
                margin: 0 8px;
            }

            .btn_borrow,
            .btn_return {
                margin-left: auto;
                margin-right: auto;
                display: block;
                width: 128px;
                height: 32px;
                font-size: 16px;
                text-align: center;
                line-height: 32px;
                color: white;
                margin-top: 32px;
                background-color: var(--primary-color);
                cursor: pointer;
                margin-bottom: 80px;
            }

            .detail-title {
                font-size: 2rem;
            }

            .avatar {
                width: 64px;
                height: 64px;
                background-color: #ccc;
                background-size: cover;
                background-position: center;
                border-radius: 50%;
                background-repeat: no-repeat;
                opacity: 1;
            }

            .detail .info {
                display: flex;
                gap: 12px;
                margin-top: 16px;
                align-self: center;
            }

            .detail .info div:last-child {
                display: flex;
                justify-content: center;
                gap: 8px;
                flex-direction: column;
            }

            .student_name {
                font-size: 1.6rem;
                font-weight: 700;
            }

            .student_id {
                font-size: 1.6rem;
            }

            .box-2 .detail {
                display: flex;
                align-items: flex-end;
                gap: 48px;
            }

            .chart {
                display: flex;
                align-items: flex-end;
                gap: 12px;
                height: 80px;
            }

            .col-1,
            .col-2,
            .col-3 {
                width: 20px;
                min-height: 8px;
                background-color: black;
                border-radius: 4px;
            }

            .col-1 {
                height: 80px;
                background-color: var(--primary-color);
            }

            .col-2 {
                height: 64px;
                background-color: #92d050;
            }

            .col-3 {
                height: 20px;
                background-color: #f2aa84;
            }

            .detail-statistic {
                display: flex;
                align-items: center;
                gap: 24px;
            }
            .infomation-chart {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .infomation-chart {
                font-size: 1.2rem;
            }

            .infomation-chart .info {
                padding-left: 16px;
                position: relative;
                margin-top: 0;
                align-self: normal;
            }

            .infomation-chart .info::before {
                content: "";
                position: absolute;
                width: 8px;
                height: 8px;
                background-color: black;
                top: 50%;
                transform: translateY(-50%);
                border-radius: 50%;
                left: 0px;
            }

            .infomation-chart .info-1::before {
                background-color: var(--primary-color);
            }

            .infomation-chart .info-2::before {
                background-color: #92d050;
            }

            .infomation-chart .info-3::before {
                background-color: #f2aa84;
            }

            .info i {
                margin-left: -8px;
                font-weight: 700;
            }

            .footer {
            }
        </style>
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="header">
            <div class="main-content">
                <div class="body">
                    <div class="box">
                        <div class="box-1">
                            <span class="title"
                                >Quản lý mượn sách thư viện</span
                            >
                            <div class="search-student-box">
                                <input
                                    type="text"
                                    name="search_box"
                                    placeholder="Nhập thông tin sinh viên"
                                    class="input_text"
                                    required
                                />
                                <span
                                    class="material-symbols-outlined search-btn"
                                    style="font-size: 26px"
                                >
                                    search
                                </span>
                            </div>

                            <div class="row">
                                <span class="waiting small-navi focus"
                                    >Đang chờ</span
                                >
                                <span class="borrowed small-navi">Đã mượn</span>
                                <span class="expired small-navi">Quá hạn</span>
                                <span class="cancel small-navi"
                                    >Đăng ký bị hủy</span
                                >
                            </div>
                        </div>
                        <div class="box-2">
                            <span class="detail-title">Thông tin chi tiết</span>
                            <div class="detail">
                                <div class="info" style="display: none">
                                    <div class="avatar"></div>
                                    <div>
                                        <span class="student_name"></span>
                                        <span class="student_id"></span>
                                    </div>
                                </div>

                                <div
                                    class="detail-statistic"
                                    style="display: none"
                                >
                                    <div class="chart">
                                        <div class="col-1"></div>
                                        <div class="col-2"></div>
                                        <div class="col-3"></div>
                                    </div>

                                    <div class="infomation-chart">
                                        <span class="info-1 info"
                                            >Đang chờ: <i>07</i></span
                                        >
                                        <span class="info-2 info"
                                            >Đang mượn: <i>05</i></span
                                        >
                                        <span class="info-3 info"
                                            >Quá hạn: <i>03</i></span
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <table>
                        <tr>
                            <td></td>
                            <td>Mã mượn</td>
                            <td>Tên tài liệu</td>
                            <td>Tác giả</td>
                            <td>Năm xuất bản</td>
                            <td>Ngày đăng ký</td>
                            <td>Ngày hết hạn</td>
                            <td>Trạng thái</td>
                        </tr>
                    </table>

                    <span class="btn_borrow">Cho mượn</span>
                    <span class="btn_return" style="display: none"
                        >Trả sách</span
                    >
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

        <script th:src="@{/js/jquery3.6.0.js}"></script>
        <script th:inline="javascript">
            /*<![CDATA[*/
            var username_account = /*[[${session.username}]]*/ '';
            var search_btn = document.querySelector(".search-btn");
            var search_input = document.querySelector(".input_text");

            search_btn.addEventListener("click", function () {
                var inputValue = search_input.value;
                performSearch(inputValue, function () {
                    waitingFocus();
                });
            });

            search_input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    var inputValue = search_input.value;
                    performSearch(inputValue, function () {
                        waitingFocus();
                    });
                }
            });

            performSearch(username_account, function () {
                waitingFocus();
            });

            var dataRecord = null;

            function performSearch(inputValue, callback) {
                $.ajax({
                    url: "/borrow/records",
                    type: "GET",
                    dataType: "json",
                    data: {
                        username: inputValue,
                    },
                    success: function (data) {
                        dataRecord = data;
                        console.log("LOAD Ở ĐÂY");
                        callback();

                        console.log("input = " + inputValue);
                        console.log(data);
                        var detail_info =
                            document.querySelector(".detail .info");
                        var detail_student_name =
                            document.querySelector(".student_name");
                        var detail_student_id =
                            document.querySelector(".student_id");
                        var detail_avatar =
                            document.querySelector(".detail .avatar");

                        detail_student_name.innerHTML = data[0].name
                            ? data[0].name
                            : data[0].student_name;

                        detail_student_id.innerHTML = data[0].username
                            ? data[0].username
                            : data[0].student_id;
                        detail_avatar.style.backgroundImage =
                            "url(" + data.avatar + ")";
                        detail_info.style.display = "flex";

                        /* Chart */
                        var num1 = 0;
                        var num2 = 0;
                        var num3 = 0;

                        data.forEach((record) => {
                            if (record.status == "Đang chờ") num1 += 1;
                            if (record.status == "Đang mượn") num2 += 1;
                            if (record.status == "Quá hạn") num3 += 1;
                        });

                        console.log(num1 + " " + num2 + " " + num3);

                        var col_1 = document.querySelector(".col-1");
                        var col_2 = document.querySelector(".col-2");
                        var col_3 = document.querySelector(".col-3");

                        const maxNum = Math.max(num1, num2, num3, 1);

                        console.log("maxNum " + maxNum);

                        col_1.style.height = (num1 / maxNum) * 80 + "px";
                        col_2.style.height = (num2 / maxNum) * 80 + "px";
                        col_3.style.height = (num3 / maxNum) * 80 + "px";

                        var info_1 = document.querySelector(".info-1 i");
                        var info_2 = document.querySelector(".info-2 i");
                        var info_3 = document.querySelector(".info-3 i");

                        info_1.innerHTML = num1;
                        info_2.innerHTML = num2;
                        info_3.innerHTML = num3;

                        var detail_statistic =
                            document.querySelector(".detail-statistic");
                        detail_statistic.style.display = "flex";
                        return true;
                    },
                });
            }
            
            // Add more management logic here...
            /*]]>*/
        </script>
    </body>
</html>
